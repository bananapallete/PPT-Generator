<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PPT Generator</title>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

<!-- Pretendard 변수 폰트 -->
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ──────────────────────────────────────────────────────────
     디자인 토큰
  ────────────────────────────────────────────────────────── */
  :root {
    /* 색상 */
    --bg:           #F7F7F8;
    --surface:      #FFFFFF;
    --surface-2:    #F2F4F7;
    --border:       #E5E7EB;
    --border-strong:#D1D5DB;

    --primary:        #2563EB;
    --primary-hover:  #1D4ED8;
    --primary-pressed:#1E40AF;
    --primary-weak:   #DBEAFE;
    --primary-weak-2: #EFF6FF;

    --text:        #111827;
    --text-2:      #4B5563;
    --text-3:      #9CA3AF;
    --text-on-blue:#FFFFFF;

    --danger:      #EF4444;
    --danger-weak: #FEE2E2;

    --success:     #10B981;

    /* 모양 */
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --r-pill: 999px;

    /* 그림자 */
    --shadow-sm: 0 1px 2px rgba(17,24,39,0.04), 0 1px 1px rgba(17,24,39,0.04);
    --shadow-md: 0 4px 12px rgba(17,24,39,0.06), 0 2px 4px rgba(17,24,39,0.04);
    --shadow-focus: 0 0 0 4px rgba(37,99,235,0.12);
  }

  html, body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  body {
    min-height: 100vh;
    padding: 56px 20px 120px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }

  .page { max-width: 680px; margin: 0 auto; }

  /* ── 헤더 ─────────────────────────────────────────── */
  .header { margin-bottom: 36px; }
  .header-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    background: var(--primary-weak);
    border-radius: var(--r-pill);
    margin-bottom: 16px;
    letter-spacing: 0;
  }
  .header-tag svg { flex-shrink: 0; }
  .header h1 {
    font-size: 32px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.025em;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 15px;
    color: var(--text-2);
    line-height: 1.55;
  }

  /* ── 카드 ───────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 24px;
    margin-bottom: 12px;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 18px;
  }
  .card-num {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 0.04em;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-3);
    font-weight: 400;
    margin-left: auto;
  }

  /* ── 폼 필드 ──────────────────────────────────────── */
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  /* Korean secondary label/text */
  .label-ko, .ko-sub {
    font-weight: 400;
    color: var(--text-3);
    font-size: 12px;
    margin-left: 6px;
    letter-spacing: 0;
  }
  .header p .ko-sub {
    margin-left: 0;
    font-size: 13px;
    display: inline-block;
    margin-top: 2px;
  }
  .card-title .ko-sub {
    font-weight: 400;
    color: var(--text-3);
    font-size: 12px;
    margin-left: 6px;
  }

  /* Text Field – Box variant from design system */
  input[type="text"] {
    width: 100%;
    height: 46px;
    padding: 0 14px;
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    font-family: inherit;
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    background: var(--surface);
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
    outline: none;
    -webkit-appearance: none;
  }
  input[type="text"]:hover { border-color: var(--text-3); }
  input[type="text"]:focus {
    border-color: var(--primary);
    box-shadow: var(--shadow-focus);
  }
  input[type="text"]::placeholder { color: var(--text-3); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ── 섹션 행 ───────────────────────────────────────── */
  .sections-list { display: flex; flex-direction: column; gap: 10px; }

  .section-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
    background: var(--surface-2);
    border-radius: var(--r-md);
    transition: background 0.12s;
  }
  .section-row:focus-within { background: var(--primary-weak-2); }

  .section-num {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    background: var(--primary);
    color: var(--text-on-blue);
    border-radius: var(--r-pill);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 600;
    margin-top: 9px;
    letter-spacing: 0;
  }

  .section-fields {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .section-fields input { height: 40px; font-size: 14px; }

  .btn-remove {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    border-radius: var(--r-pill);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, color 0.12s;
    margin-top: 7px;
  }
  .btn-remove:hover {
    background: var(--danger-weak);
    color: var(--danger);
  }

  /* ── 버튼들 ────────────────────────────────────────── */
  /* Weak primary button (design system: Color=Primary, Variant=Weak, Size=M) */
  .btn-add {
    width: 100%;
    height: 44px;
    border: none;
    background: var(--primary-weak);
    color: var(--primary);
    border-radius: var(--r-pill);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    transition: background 0.12s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    letter-spacing: -0.01em;
  }
  .btn-add:hover { background: #C7DBFE; }
  .btn-add:active { background: #B5CCFB; }

  /* Fill primary button (design system: Color=Primary, Variant=Fill, Size=L) */
  .btn-generate {
    width: 100%;
    height: 56px;
    background: var(--primary);
    color: var(--text-on-blue);
    border: none;
    border-radius: var(--r-pill);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    letter-spacing: -0.01em;
    transition: background 0.12s, transform 0.06s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-generate:hover { background: var(--primary-hover); }
  .btn-generate:active { background: var(--primary-pressed); transform: translateY(0.5px); }
  .btn-generate:disabled {
    background: var(--primary);
    opacity: 0.6;
    cursor: not-allowed;
  }
  .btn-generate.loading .btn-icon-static { display: none; }
  .btn-generate:not(.loading) .btn-icon-loading { display: none; }

  /* ── 슬라이드 카운트 안내 ───────────────────────────── */
  .slide-count {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 16px;
    background: var(--primary-weak-2);
    border-radius: var(--r-md);
    font-size: 13px;
    color: var(--primary);
    font-weight: 500;
    margin-top: 4px;
  }
  .slide-count strong { font-weight: 700; }

  /* ── 로딩 스피너 ───────────────────────────────────── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  /* ── 토스트 (디자인 시스템 Toast Bottom) ───────────── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(31,41,55,0.92);
    backdrop-filter: blur(8px);
    color: white;
    padding: 12px 20px;
    border-radius: var(--r-pill);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    transition: transform 0.32s cubic-bezier(0.34,1.4,0.64,1), opacity 0.2s;
    z-index: 999;
    white-space: nowrap;
    max-width: calc(100vw - 40px);
    opacity: 0;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.error { background: rgba(220,38,38,0.96); }

  @media (max-width: 480px) {
    body { padding: 32px 16px 100px; }
    .header h1 { font-size: 26px; }
    .two-col { grid-template-columns: 1fr; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <div class="header">
    <h1>PPT Generator</h1>
    <p>Create a presentation deck instantly from your agenda.<br/><span class="ko-sub">아젠다를 입력하면 발표 자료가 자동으로 생성됩니다.</span></p>
  </div>

  <!-- Presentation Info -->
  <div class="card">
    <div class="card-head">
      <span class="card-num">01</span>
      <span class="card-title">Presentation Info <span class="ko-sub">발표 정보</span></span>
    </div>
    <div class="field">
      <label>Main Title <span class="label-ko">발표 제목</span></label>
      <input type="text" id="mainTitle" placeholder="e.g. H1 2025 Business Strategy Review" />
    </div>
  </div>

  <!-- Speaker Info -->
  <div class="card">
    <div class="card-head">
      <span class="card-num">02</span>
      <span class="card-title">Speaker Info <span class="ko-sub">발표자 정보</span></span>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Speaker <span class="label-ko">발표자</span></label>
        <input type="text" id="speaker" placeholder="Full name" />
      </div>
      <div class="field">
        <label>Affiliation <span class="label-ko">소속</span></label>
        <input type="text" id="affiliation" placeholder="Organization · Team" />
      </div>
    </div>
  </div>

  <!-- Sections -->
  <div class="card">
    <div class="card-head">
      <span class="card-num">03</span>
      <span class="card-title">Sections <span class="ko-sub">섹션 구성</span></span>
      <span class="card-desc">1 divider + 1 inner page per section</span>
    </div>
    <div class="sections-list" id="sectionsList"></div>
    <button class="btn-add" onclick="addSection()" type="button">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></svg>
      Add Section
    </button>
  </div>

  <!-- Slide count -->
  <div class="slide-count">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <strong id="totalSlides">2</strong> slides will be generated
  </div>

  <!-- Generate button -->
  <button class="btn-generate" id="generateBtn" onclick="generate()" type="button">
    <svg class="btn-icon-static" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14,2 14,8 20,8"/></svg>
    <span class="btn-icon-loading spinner"></span>
    <span class="btn-label">Generate PPT File</span>
  </button>

</div>

<div class="toast" id="toast"></div>

//   w  : 텍스트 박스 너비
//   h  : 텍스트 박스 높이
//   fontSize : 폰트 크기 (Figma 픽셀)
//   color    : 16진수 컬러 코드 (# 제외)
//   bold     : 굵게 (true/false)
//   align    : 'left' | 'center' | 'right'
//
// 위치를 왼쪽으로 옮기려면 x값을 줄이고, 폰트 크기는 fontSize로 조절합니다.
// ═════════════════════════════════════════════════════════════════════

const FONT = 'Pretendard';   // 모든 슬라이드 공통 폰트

const CONFIG = {

  // ─── 1. 표지 (Cover) ────────────────────────────────────────────
  cover: {
    mainTitle:   { x: 62,  y: 503, w: 1646, h: 200, fontSize: 90, lineSpacingMultiple: 1.1 },
    speaker:     { x: 70,  y: 911, w: 678,  h: 38,  fontSize: 30, bold: true },
    affiliation: { x: 70,  y: 949, w: 800,  h: 28,  fontSize: 20 },
  },

  // ─── 2. 목차 (Agenda) ──────────────────────────────────────────
  // 좌/우 2열 배치, 한 열에 최대 4개까지
  agenda: {
    col1X:  80,    // 1열 시작 X
    col2X:  1006,  // 2열 시작 X
    startY: 295,   // 첫 번째 행 Y
    rowH:   121,   // 행 간격
    dividerW: 837, // 행 위 구분선 길이

    // 행 시작점(x, y)을 기준으로 한 상대 좌표
    numOffsetX:      10,  // 번호 X 오프셋
    numOffsetY:      30,  // 번호 Y 오프셋
    titleOffsetX:    85,  // 제목·설명 X 오프셋
    titleOffsetY:    30,  // 제목 Y 오프셋
    overviewOffsetY: 77,  // 설명 Y 오프셋

    number:   { w: 75,  h: 40, fontSize: 40, bold: true, color: '157CBF' },
    title:    { w: 690, h: 32, fontSize: 35, bold: true },
    overview: { w: 690, h: 22, fontSize: 20, color: '696969' },

    // Title이 길어서 2줄 이상이 될 때 적용 (한 행 내에서)
    titleAutoFit: {
      multilineFontSize: 26,    // 여러 줄일 때 폰트 (1줄: 35px, 2줄+: 26px)
      lineHeight:        1.2,   // 줄 간격
      overviewGap:       8,     // Title 박스 끝과 Overview 사이 간격 (px)
    },
  },

  // ─── 3. 간지 (Divider) ─────────────────────────────────────────
  divider: {
    number:   { x: 66,  y: 99,  w: 1700, h: 80,  fontSize: 65 },
    title:    { x: 66,  y: 213, w: 1700, h: 140, fontSize: 115, lineSpacingMultiple: 1.1 },
    overview: { x: 72,  y: 355, w: 1700, h: 50,  fontSize: 38 },

    // Title이 길어서 2줄 이상이 될 때 적용되는 설정
    titleAutoFit: {
      multilineFontSize: 80,    // 여러 줄일 때 폰트 크기 (1줄: 115px, 2줄+: 80px)
      lineHeight:        1.15,  // 줄 간격 (1.0 = 폰트 크기와 같음)
      overviewGap:       20,    // Title 박스 끝과 Overview 시작점 간격 (px)
    },
  },

  // ─── 4. 내지 (Inner) ───────────────────────────────────────────
  inner: {
    title:    { x: 77,   y: 73, w: 1200, h: 48, fontSize: 45, bold: true },
    overview: { x: 1400, y: 93, w: 440,  h: 28, fontSize: 20, align: 'right' },

    // Title이 길어서 1줄에 안 들어갈 때 — 폰트만 줄여서 1줄 유지 (박스 높이는 고정)
    titleAutoFit: {
      minFontSize: 28,    // 더 줄일 수 있는 최소 폰트 크기 (기본 45px → 최소 28px)
      step:         1,    // 한 번에 줄이는 단위 (작을수록 정밀, 클수록 빠름)
    },
  },

  // ─── 5. 푸터 (목차/간지/내지 공통) ──────────────────────────────
  footer: {
    left:  { x: 80,   y: 981, w: 700, h: 28, fontSize: 20 },
    right: { x: 1490, y: 981, w: 350, h: 28, fontSize: 20, align: 'right' },
  },
};

// ─── 좌표 변환 (수정 X) ─────────────────────────────────────────────
// Figma px → pptxgenjs inch / pt 변환
const S = px => parseFloat((px * (10 / 1920)).toFixed(4));
const F = px => parseFloat((px * 0.375).toFixed(1));

// CONFIG 객체 → pptxgenjs 옵션 객체 변환
function opt(c, override = {}) {
  const o = { ...c, ...override };
  return {
    x: S(o.x), y: S(o.y), w: S(o.w), h: S(o.h),
    fontFace: o.fontFace || FONT,
    fontSize: F(o.fontSize),
    color: o.color || '000000',
    bold: !!o.bold,
    align: o.align || 'left',
    margin: 0,
    shrinkText: o.shrinkText !== false,
    ...(o.lineSpacingMultiple ? { lineSpacingMultiple: o.lineSpacingMultiple } : {}),
  };
}

// 텍스트가 주어진 너비에 몇 줄로 표시될지 추정 (Canvas measureText 사용)
// Pretendard 기준 — 한글/영문 모두 잘 작동함
function estimateLineCount(text, fontSizePx, maxWidthPx, fontFace = FONT) {
  if (!text) return 0;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = `${fontSizePx}px ${fontFace}, sans-serif`;
  const totalWidth = ctx.measureText(text).width;
  // 한글/영문 모두 단순화: 전체 폭 / 줄 폭 ≈ 줄 수
  return Math.max(1, Math.ceil(totalWidth / maxWidthPx));
}

// Divider Title 자동 맞춤: 1줄이면 그대로, 2줄+이면 폰트 줄이고 박스 높이 늘림
// 반환: { fontSize, h, overviewY }
function fitDividerTitle(text, base, autoFit) {
  const oneLineCount = estimateLineCount(text, base.fontSize, base.w);

  // 1줄이면 원본 설정 그대로
  if (oneLineCount <= 1) {
    return {
      fontSize: base.fontSize,
      h: base.h,
      overviewY: base.y + base.h + autoFit.overviewGap,
    };
  }

  // 2줄+이면 폰트 줄이고 다시 측정 — 단, 최소 2줄 공간 확보
  const newFontSize = autoFit.multilineFontSize;
  const newLineCount = Math.max(2, estimateLineCount(text, newFontSize, base.w));
  const newH = Math.ceil(newFontSize * autoFit.lineHeight * newLineCount);

  return {
    fontSize: newFontSize,
    h: newH,
    overviewY: base.y + newH + autoFit.overviewGap,
  };
}

// Agenda Title 자동 맞춤 (행 시작점 기준 상대 좌표 반환)
// 반환: { fontSize, h, overviewOffsetY }
function fitAgendaTitle(text, base, autoFit, baseTitleOffsetY, baseOverviewOffsetY) {
  const oneLineCount = estimateLineCount(text, base.fontSize, base.w);

  // 1줄이면 원본 설정 그대로
  if (oneLineCount <= 1) {
    return {
      fontSize: base.fontSize,
      h: base.h,
      overviewOffsetY: baseOverviewOffsetY,
    };
  }

  // 2줄+이면 폰트 줄이고 박스 높이 + Overview Y 동적 계산 (최소 2줄 보장)
  const newFontSize = autoFit.multilineFontSize;
  const newLineCount = Math.max(2, estimateLineCount(text, newFontSize, base.w));
  const newH = Math.ceil(newFontSize * autoFit.lineHeight * newLineCount);

  return {
    fontSize: newFontSize,
    h: newH,
    overviewOffsetY: baseTitleOffsetY + newH + autoFit.overviewGap,
  };
}

// Inner Title 자동 맞춤: 1줄에 들어갈 때까지 폰트 점진적으로 축소 (박스 크기는 고정)
// 반환: { fontSize }
function fitInnerTitle(text, base, autoFit) {
  // 기본 폰트로 1줄에 들어가면 그대로
  if (estimateLineCount(text, base.fontSize, base.w) <= 1) {
    return { fontSize: base.fontSize };
  }
  // 1줄에 들어가는 가장 큰 폰트 크기 찾기 (기본 → 최소까지 step씩 줄임)
  for (let fs = base.fontSize - autoFit.step; fs >= autoFit.minFontSize; fs -= autoFit.step) {
    if (estimateLineCount(text, fs, base.w) <= 1) {
      return { fontSize: fs };
    }
  }
  // 최소까지 줄여도 안 들어가면 최소 폰트로 (PowerPoint의 shrinkText가 추가 처리)
  return { fontSize: autoFit.minFontSize };
}

// ═════════════════════════════════════════════════════════════════════
// UI 로직 (수정할 일 거의 없음)
// ═════════════════════════════════════════════════════════════════════

let sectionCount = 0;

function addSection(title = '', overview = '') {
  sectionCount++;
  const row = document.createElement('div');
  row.className = 'section-row';
  const num = document.querySelectorAll('.section-row').length + 1;
  row.innerHTML = `
    <div class="section-num">${String(num).padStart(2,'0')}</div>
    <div class="section-fields">
      <input type="text" class="sec-title" placeholder="Section title (e.g. Introduction)" value="${escHtml(title)}" oninput="updatePreview()" />
      <input type="text" class="sec-overview" placeholder="Short description — optional" value="${escHtml(overview)}" />
    </div>
    <button class="btn-remove" onclick="removeSection(this)" aria-label="Remove section">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg>
    </button>
  `;
  document.getElementById('sectionsList').appendChild(row);
  updatePreview();
  row.querySelector('.sec-title').focus();
}

function removeSection(btn) {
  btn.closest('.section-row').remove();
  renumber();
  updatePreview();
}

function renumber() {
  document.querySelectorAll('.section-row').forEach((r, i) => {
    r.querySelector('.section-num').textContent = String(i+1).padStart(2,'0');
  });
}

function updatePreview() {
  const rows = document.querySelectorAll('.section-row');
  document.getElementById('totalSlides').textContent = 2 + rows.length * 2;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ═════════════════════════════════════════════════════════════════════
// PPT 생성 로직
// ═════════════════════════════════════════════════════════════════════

async function generate() {
  const mainTitle   = document.getElementById('mainTitle').value.trim();
  const speaker     = document.getElementById('speaker').value.trim();
  const affiliation = document.getElementById('affiliation').value.trim();
  const rows        = document.querySelectorAll('.section-row');
  const sections    = Array.from(rows).map(r => ({
    title:    r.querySelector('.sec-title').value.trim(),
    overview: r.querySelector('.sec-overview').value.trim(),
  })).filter(s => s.title);

  if (!mainTitle)       return toast('Please enter a presentation title.', true);
  if (!speaker)         return toast('Please enter the speaker name.', true);
  if (!sections.length) return toast('Please add at least one section.', true);

  const btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-label').textContent = 'Generating...';

  try {
    const pres = new PptxGenJS();
    pres.layout = 'LAYOUT_16x9';
    const C = CONFIG;

    // ─── 1. 표지 ──────────────────────────────────────────────
    const cover = pres.addSlide();
    cover.background = { data: BG.cover };
    cover.addText(mainTitle.toUpperCase(), opt(C.cover.mainTitle));
    cover.addText(speaker,                 opt(C.cover.speaker));
    cover.addText(affiliation,             opt(C.cover.affiliation));

  // ─── 2. 목차 ──────────────────────────────────────────────
  const agenda = pres.addSlide();
    agenda.background = { data: BG.agenda };

    // 두 컬럼 각각의 다음 행 시작 Y를 추적 (행이 길어지면 다음 행이 아래로 밀림)
    const nextRowY = [C.agenda.startY, C.agenda.startY];

    sections.forEach((sec, i) => {
      const col = i < 4 ? 0 : 1;
      const baseX = col === 0 ? C.agenda.col1X : C.agenda.col2X;
      const baseY = nextRowY[col];

      // 상단 구분선
      agenda.addShape(pres.ShapeType.line, {
        x: S(baseX), y: S(baseY), w: S(C.agenda.dividerW), h: 0,
        line: { color: 'b0b0b0', width: 0.5 },
      });

      // 번호 · 제목 · 설명 (행 시작점 + 오프셋)
      agenda.addText(String(i+1).padStart(2,'0') + '.', opt(C.agenda.number, {
        x: baseX + C.agenda.numOffsetX,
        y: baseY + C.agenda.numOffsetY,
      }));

      // Title 길이에 따라 폰트/높이/Overview Y 동적 조정
      const aFit = fitAgendaTitle(
        sec.title,
        C.agenda.title,
        C.agenda.titleAutoFit,
        C.agenda.titleOffsetY,
        C.agenda.overviewOffsetY
      );

      agenda.addText(sec.title, opt(C.agenda.title, {
        x: baseX + C.agenda.titleOffsetX,
        y: baseY + C.agenda.titleOffsetY,
        fontSize: aFit.fontSize,
        h:        aFit.h,
      }));
      if (sec.overview) agenda.addText(sec.overview, opt(C.agenda.overview, {
        x: baseX + C.agenda.titleOffsetX,
        y: baseY + aFit.overviewOffsetY,
      }));

      // 이 행이 실제로 차지한 높이 = max(기본 rowH, 늘어난 컨텐츠 높이)
      // 늘어난 케이스: Overview 박스의 끝이 기본 rowH보다 아래로 갈 때
      const contentH = aFit.overviewOffsetY + C.agenda.overview.h;
      nextRowY[col] = baseY + Math.max(C.agenda.rowH, contentH);
    });
    addFooter(agenda, mainTitle, speaker);

    // ─── 3. 섹션별 간지 + 내지 ────────────────────────────────
    sections.forEach((sec, i) => {
      // 간지 — Title 길이에 따라 폰트/높이/Overview Y 동적 조정
      const d = pres.addSlide();
      d.background = { data: BG.divider };
      d.addText(String(i+1).padStart(2,'0'), opt(C.divider.number));

      const fit = fitDividerTitle(sec.title, C.divider.title, C.divider.titleAutoFit);
      d.addText(sec.title, opt(C.divider.title, {
        fontSize: fit.fontSize,
        h:        fit.h,
      }));
      if (sec.overview) d.addText(sec.overview, opt(C.divider.overview, {
        y: fit.overviewY,
      }));
      addFooter(d, mainTitle, speaker);

      // 내지 — Title이 길면 폰트만 줄여서 1줄 유지 (박스 크기는 고정)
      const inner = pres.addSlide();
      inner.background = { data: BG.inner };
      const iFit = fitInnerTitle(sec.title, C.inner.title, C.inner.titleAutoFit);
      inner.addText(sec.title, opt(C.inner.title, { fontSize: iFit.fontSize }));
      if (sec.overview) inner.addText(sec.overview, opt(C.inner.overview));
      addFooter(inner, mainTitle, speaker);
    });

    const fileName = mainTitle.replace(/[^\w가-힣]/g, '_') + '.pptx';
    await pres.writeFile({ fileName });
    toast('✅ PPT generated! Download will begin shortly.');

  } catch(e) {
    toast('❌ Error: ' + e.message, true);
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
    btn.querySelector('.btn-label').textContent = 'Generate PPT File';
  }
}

function addFooter(slide, mainTitle, speaker) {
  slide.addText(mainTitle, opt(CONFIG.footer.left));
  slide.addText(speaker,   opt(CONFIG.footer.right));
}

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 3500);
}

// Sample sections (placeholders — replace with your own)
addSection('Sample Section 1 — Replace me', 'Add a short description here');
addSection('Sample Section 2 — Replace me', 'Add a short description here');
addSection('Sample Section 3 — Replace me', 'Add a short description here');

</script>
